all:
  children:
    # Every Proxmox node; names and IPs come from nodes in group_vars/all.yml
    proxmox:
      vars:
        ansible_host: "{{ nodes[inventory_hostname].ip }}"
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      hosts:
        live-laugh-homelab:
        live-laugh-tomcruise:
        live-laugh-nicolekidman:
    # Reached through the guest's node with lxc-attach (connection_plugins/pct.py), so containers don't need sshd
    lxc:
      vars:
        ansible_connection: pct
        ansible_host: "{{ nodes[guests[inventory_hostname].node].ip }}"
        ansible_user: root
        ansible_private_key_file: ~/.ssh/id_ed25519
        ansible_python_interpreter: /usr/bin/python3
        # IDs and nodes come from guests in group_vars/all.yml
        proxmox_vmid: "{{ guests[inventory_hostname].vmid }}"
      hosts:
        pihole:
        pihole2:
        caddy:
        caddy2:
        gitea:
        jellyfin:
        uptimekuma:
        metrics:
        pbs:
        pbs2:
          # Read-only for the cluster: it only restores from pbs2, so a node can't delete the second copy
          pbs_cluster_role: DatastoreReader
        runner:
        deployer:
        arr:
