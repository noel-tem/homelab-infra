- ansible.builtin.import_playbook: locate-guests.yml

# First, so Jellyfin's setup sees the real media directory rather than an empty one under the mount point
- name: Give Jellyfin the media
  hosts: proxmox
  roles:
    - role: media_mount
      media_mount_guests: [jellyfin]
      when: inventory_hostname == guests.jellyfin.node

- name: Configure Jellyfin
  hosts: jellyfin
  roles:
    - jellyfin
    # SMB share of the media for copying files in
    - media_share

# After Jellyfin is installed, so its user is already in the container's render group
- name: Give Jellyfin the iGPU
  hosts: proxmox
  roles:
    # pct only sees containers on its own node
    - role: gpu_passthrough
      when: inventory_hostname == guests.jellyfin.node
