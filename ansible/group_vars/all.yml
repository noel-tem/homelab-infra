dns_domain: home.arpa
# Nodes whose CPUs clock down when idle (roles/cpu_governor); the rest stay on Proxmox's default, performance
cpu_governor_nodes: [live-laugh-nicolekidman]
# Root's key in every container; Tofu reads it from here so the deployer (which has its own key) builds identical containers
ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJm21vYZqBMhgV4jXQ1WQcaCt15tPdzDx8ElhJoigcgs noel@wsl
home_subnet: 192.168.0.0/24
# Proxmox cluster nodes, keyed by node name; each is in the Ansible inventory and runs a subnet router
nodes:
  live-laugh-homelab: { ip: 192.168.0.50 }
  live-laugh-tomcruise: { ip: 192.168.0.51 }
  # i7-6700K with an iGPU, root on ZFS; holds the HDDs
  live-laugh-nicolekidman: { ip: 192.168.0.52 }
# The one place guest IDs, addresses and nodes live; Tofu reads this file too (stacks/homelab/locals.tf)
# node is where Tofu creates the guest; moving it later doesn't need a change here, since Tofu ignores the
# node after creation and Ansible connects through whichever node it's on (playbooks/locate-guests.yml)
# running: false switches a guest off: Tofu stops it and keeps it down across reboots, and Ansible skips it
guests:
  pihole: { vmid: 100, ip: 192.168.0.10, node: live-laugh-homelab }
  # DHCP; Tofu doesn't set this one, it's only here for proxied_services
  homeassistant: { vmid: 102, ip: 192.168.0.83, node: live-laugh-homelab }
  mosquitto: { vmid: 104, ip: 192.168.0.20, node: live-laugh-homelab }
  caddy: { vmid: 105, ip: 192.168.0.21, node: live-laugh-homelab }
  gitea: { vmid: 106, ip: 192.168.0.22, node: live-laugh-tomcruise }
  # Needs a node with an iGPU at /dev/dri/renderD128, and the media is a bind mount from media_node, so it has to stay there
  jellyfin: { vmid: 107, ip: 192.168.0.23, node: live-laugh-nicolekidman }
  uptimekuma: { vmid: 108, ip: 192.168.0.24, node: live-laugh-homelab }
  metrics: { vmid: 109, ip: 192.168.0.25, node: live-laugh-homelab }
  # Its datastore is on the SSD, so it has to stay on that node (see disk_storage)
  pbs: { vmid: 110, ip: 192.168.0.26, node: live-laugh-tomcruise }
  # Second copy of pbs's backups, pulled every morning (roles/pbs_sync); its datastore is on nicolekidman's 1 TB HDD
  pbs2: { vmid: 115, ip: 192.168.0.32, node: live-laugh-nicolekidman }
  # CI: a Gitea Actions runner for Claude and lint jobs (no infra credentials), and the agent that deploys main (README: CI)
  runner: { vmid: 112, ip: 192.168.0.29, node: live-laugh-homelab }
  deployer: { vmid: 113, ip: 192.168.0.30, node: live-laugh-homelab }
  # Sonarr, Radarr, Prowlarr, FlareSolverr, Bazarr, Seerr and qBittorrent behind Surfshark (roles/arr)
  # Shares jellyfin's media, so it has to be on media_node too
  arr: { vmid: 114, ip: 192.168.0.31, node: live-laugh-nicolekidman }
# The repo CI runs for; the runner registers with this Gitea and the deployer pulls from it
gitea_url: http://{{ guests.gitea.ip }}:3000
gitea_repo: noeltem/homelab-infra
# Each one gets http://<name>.<dns_domain> on Caddy and a Pi-hole record pointing at Caddy
proxied_services:
  pihole: "{{ guests.pihole.ip }}:80"
  homeassistant: "{{ guests.homeassistant.ip }}:8123"
  gitea: "{{ guests.gitea.ip }}:3000"
  jellyfin: "{{ guests.jellyfin.ip }}:8096"
  uptime: "{{ guests.uptimekuma.ip }}:3001"
  grafana: "{{ guests.metrics.ip }}:3000"
  sonarr: "{{ guests.arr.ip }}:8989"
  radarr: "{{ guests.arr.ip }}:7878"
  prowlarr: "{{ guests.arr.ip }}:9696"
  bazarr: "{{ guests.arr.ip }}:6767"
  qbit: "{{ guests.arr.ip }}:8080"
  seerr: "{{ guests.arr.ip }}:5055"
  # PBS only serves HTTPS
  pbs: "https://{{ guests.pbs.ip }}:8007"
  pbs2: "https://{{ guests.pbs2.ip }}:8007"
# InfluxDB on the metrics guest; Proxmox writes to it and Grafana reads from it
influxdb_url: http://{{ guests.metrics.ip }}:8086
influxdb_org: homelab
influxdb_bucket: proxmox
# PBS's datastore, and the user whose API token the cluster backs up as (roles pbs and pbs_storage)
pbs_datastore: homelab
pbs_cluster_user: pve@pbs
# Backs up and prunes its own backups, nothing else
pbs_cluster_role: DatastorePowerUser
# The operator token InfluxDB is set up with; lives in .env so it never needs to be in the repo
influxdb_token: "{{ lookup('ansible.builtin.env', 'INFLUXDB_TOKEN') }}"
# media_node pools its three 2 TB HDDs with mergerfs at /mnt/pool, set up by hand (README: Media), and
# media_host_path on it is bind-mounted into every guest in media_guests at media_path (roles/media_mount),
# so downloads and the library share one filesystem and Sonarr/Radarr can hardlink instead of copying
media_node: live-laugh-nicolekidman
media_host_path: /mnt/pool/media
media_path: /mnt/media
media_guests: [jellyfin, arr]
# Owns the media and is in every guest that writes to it; fixed so files keep working across guests (the host sees gid 100000 + this)
media_group: library
media_gid: 2000
# arr's user, which owns the media folders (the host sees uid 100000 + this)
media_uid: 2000
# Made under media_host_path on media_node by roles/media_mount, owned by media_uid and media_group with setgid, so
# everything created in them stays in the media group. Downloads and the library on one filesystem, so imports are hardlinks
media_dirs:
  - downloads
  - downloads/tv
  - downloads/movies
  - downloads/anime
  - movies
  - shows
  # Its own library and category, so anime gets its own Jellyfin library and Sonarr's anime settings
  - anime
