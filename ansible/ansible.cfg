[defaults]
inventory = inventory.yml
roles_path = roles
# Local plugins: pct is the container connection (see connection_plugins/pct.py)
connection_plugins = connection_plugins
# Gather each host's facts once per run instead of once per play
gathering = smart
# Enough to run on every container at once
forks = 20

[connection]
# Sends modules over stdin instead of uploading them first, cutting the round trips per task
pipelining = True

[paramiko_connection]
# A pty would swallow the end of a pipelined module's stdin; nothing here uses sudo, which is what it's for
pty = False
