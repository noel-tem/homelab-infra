- name: Proxmox nodes
  ansible.builtin.import_playbook: playbooks/proxmox-host.yml
# Before anything connects to a container, so each is reached through the node it's on now
- name: Find the node each container is on
  ansible.builtin.import_playbook: playbooks/locate-guests.yml

- name: Bootstrap Python in containers
  hosts: lxc
  gather_facts: false
  tasks:
    # A stopped container can't be reached
    - name: Skip containers that are switched off
      ansible.builtin.meta: end_host
      when: not guests[inventory_hostname].running | default(true)

    # Modules need Python, so install it with raw before anything else runs
    # The pct connection doesn't quote raw commands, so without a shell the Proxmox host would run everything after ||
    - name: Install python3
      ansible.builtin.raw: command -v python3 || (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3)
      args:
        executable: /bin/sh
      register: python_install
      changed_when: "'Setting up python3' in python_install.stdout"

- name: Automatic security updates
  ansible.builtin.import_playbook: playbooks/auto-updates.yml
- name: Caddy
  ansible.builtin.import_playbook: playbooks/caddy.yml
- name: Gitea
  ansible.builtin.import_playbook: playbooks/gitea.yml
- name: Jellyfin
  ansible.builtin.import_playbook: playbooks/jellyfin.yml
- name: Arr stack
  ansible.builtin.import_playbook: playbooks/arr.yml
- name: Uptime Kuma
  ansible.builtin.import_playbook: playbooks/uptimekuma.yml
- name: InfluxDB and Grafana
  ansible.builtin.import_playbook: playbooks/metrics.yml
- name: Proxmox Backup Server
  ansible.builtin.import_playbook: playbooks/pbs.yml
- name: CI runner and deployer
  ansible.builtin.import_playbook: playbooks/ci.yml
# After Caddy, so names don't point at it until it's serving them
- name: Pi-hole
  ansible.builtin.import_playbook: playbooks/pihole.yml
