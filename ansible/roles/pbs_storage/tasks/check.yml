- name: Read Proxmox storage
  ansible.builtin.command: pvesh get /storage --output-format json
  register: pbs_storage_list
  changed_when: false
  check_mode: false

# Read by the token and connect steps; a dry run never connects, since those need a real token
- name: Note which PBS servers the cluster needs connecting to
  ansible.builtin.set_fact:
    pbs_storage_missing: >-
      {{ [] if ansible_check_mode else pbs_storage_servers
      | rejectattr('storage_id', 'in', pbs_storage_list.stdout | from_json | map(attribute='storage') | list)
      | map(attribute='guest') | list }}
