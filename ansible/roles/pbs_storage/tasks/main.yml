# Runs on a Proxmox node, after check.yml there and token.yml on each PBS
- name: Add PBS as storage
  ansible.builtin.command:
    argv:
      - pvesm
      - add
      - pbs
      - "{{ item.storage_id }}"
      - --server={{ guests[item.guest].ip }}
      - --datastore={{ pbs_datastore }}
      - --username={{ pbs.pbs_storage_token.tokenid }}
      - --password={{ pbs.pbs_storage_token.value }}
      - --fingerprint={{ pbs.pbs_storage_cert.stdout | regex_search('Fingerprint \(sha256\):\s*(\S+)', '\1') | first }}
      - --content=backup
      - --prune-backups={{ pbs_storage_retention }}
  vars:
    pbs: "{{ hostvars[item.guest] }}"
  loop: "{{ pbs_storage_servers }}"
  changed_when: true
  when: item.guest in pbs_storage_missing
  no_log: true

# The address is the only thing compared, so a PBS that moves (a renumber, say) keeps working; pbs_storage_list
# is from check.yml. pvesm won't change a PBS storage's server ("fixed parameter"), so this edits storage.cfg,
# in place rather than through a temp file, since it's on /etc/pve
- name: Point the storage at PBS's current address
  ansible.builtin.shell: >-
    cfg=$(sed '/^pbs: {{ item.storage_id }}$/,/^$/ s/^\tserver .*/\tserver {{ guests[item.guest].ip }}/' /etc/pve/storage.cfg)
    && printf '%s\n' "$cfg" > /etc/pve/storage.cfg
  vars:
    pbs_storage_current: "{{ pbs_storage_list.stdout | from_json | selectattr('storage', '==', item.storage_id) | first }}"
  loop: "{{ pbs_storage_servers }}"
  changed_when: true
  when:
    - item.storage_id in pbs_storage_list.stdout | from_json | map(attribute='storage')
    - pbs_storage_current.server != guests[item.guest].ip

# Every backup is encrypted on the node before it's sent, so pbs, pbs2 and the B2 copy (roles/pbs_offsite) only
# ever hold encrypted data. Both storages get the same key: pbs2 restores the copies it pulled from pbs.
# Only set when missing, so the key is never swapped by accident; changing it is a manual job (README: Backups)
- name: Check which storages have the encryption key
  ansible.builtin.stat:
    path: /etc/pve/priv/storage/{{ item.storage_id }}.enc
  loop: "{{ pbs_storage_servers }}"
  register: pbs_storage_key_files

- name: Require the encryption key
  ansible.builtin.assert:
    that: pbs_storage_encryption_key | length > 0
    fail_msg: "Set PBS_ENCRYPTION_KEY to encrypt backups (README: Backups)"
  when: pbs_storage_key_files.results | rejectattr('stat.exists') | list | length > 0

# pvesh rather than pvesm, which wants a path to a key file instead of the key itself
- name: Give the storages the encryption key
  ansible.builtin.command:
    argv: [pvesh, set, "/storage/{{ item.item.storage_id }}", "--encryption-key={{ pbs_storage_encryption_key }}"]
  loop: "{{ pbs_storage_key_files.results }}"
  loop_control:
    label: "{{ item.item.storage_id }}"
  changed_when: true
  when: not item.stat.exists
  no_log: true

- name: Read backup jobs
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: pbs_storage_jobs
  changed_when: false
  check_mode: false

# Every guest, including ones added later; volumes marked backup = false (Jellyfin's media) are skipped
- name: Create the nightly backup job
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/backup
      - --id={{ pbs_storage_job_id }}
      - --schedule={{ pbs_storage_job_schedule }}
      - --storage={{ pbs_storage_job_storage }}
      - --all=1
      - --mode=snapshot
  changed_when: true
  when: pbs_storage_job_id not in pbs_storage_jobs.stdout | from_json | map(attribute='id')
