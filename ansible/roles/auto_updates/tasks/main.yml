- name: Install unattended-upgrades and needrestart
  ansible.builtin.apt:
    name: [unattended-upgrades, needrestart]
    update_cache: true
    cache_valid_time: 3600

- name: Turn on daily upgrades
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

# Its own file so the package's 50unattended-upgrades conffile stays untouched
- name: Write unattended-upgrades config
  ansible.builtin.template:
    src: 52unattended-upgrades-homelab.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-homelab
    mode: "0644"

# Containers share the host's kernel, so restarting services is enough; the default would only list them
- name: Restart services with outdated libraries automatically
  ansible.builtin.copy:
    content: |
      $nrconf{restart} = 'a';
    dest: /etc/needrestart/conf.d/homelab.conf
    mode: "0644"

- name: Enable apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
