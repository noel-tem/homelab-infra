# Runs on pbs2, after roles/pbs and roles/pbs_sync
- name: Read S3 endpoints
  ansible.builtin.command: proxmox-backup-manager s3 endpoint list --output-format json
  register: pbs_offsite_endpoints
  changed_when: false
  check_mode: false
  # PBS isn't installed yet on a first dry run
  failed_when: pbs_offsite_endpoints.rc != 0 and not ansible_check_mode

- name: Read datastores
  ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
  register: pbs_offsite_datastores
  changed_when: false
  check_mode: false
  failed_when: pbs_offsite_datastores.rc != 0 and not ansible_check_mode

- name: Note what's missing
  ansible.builtin.set_fact:
    pbs_offsite_endpoint_missing: >-
      {{ pbs_offsite_endpoint_id not in pbs_offsite_endpoints.stdout | default('[]', true) | from_json | map(attribute='id') }}
    pbs_offsite_datastore_missing: >-
      {{ pbs_offsite_datastore not in pbs_offsite_datastores.stdout | default('[]', true) | from_json | map(attribute='name') }}

# By variable name, so no secret ends up in the output
- name: Require the B2 settings
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', item.env) | length > 0
    fail_msg: "Set {{ item.env }} to connect pbs2 to B2 (README: Backups)"
    quiet: true
  loop:
    - { env: B2_KEY_ID, needed: "{{ pbs_offsite_endpoint_missing }}" }
    - { env: B2_APPLICATION_KEY, needed: "{{ pbs_offsite_endpoint_missing }}" }
    - { env: B2_REGION, needed: "{{ pbs_offsite_endpoint_missing }}" }
    - { env: B2_BUCKET, needed: "{{ pbs_offsite_datastore_missing }}" }
  when: item.needed | bool

# B2's S3 API doesn't support If-None-Match, which PBS sends unless told not to
- name: Add B2 as an S3 endpoint
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - s3
      - endpoint
      - create
      - "{{ pbs_offsite_endpoint_id }}"
      - --endpoint=s3.{{ pbs_offsite_b2_region }}.backblazeb2.com
      - --region={{ pbs_offsite_b2_region }}
      - --path-style=true
      - --provider-quirks=skip-if-none-match-header
      - --access-key={{ pbs_offsite_b2_key_id }}
      - --secret-key={{ pbs_offsite_b2_application_key }}
  changed_when: true
  when: pbs_offsite_endpoint_missing | bool
  no_log: true

# The reuse flags take over a datastore an earlier pbs2 left in the bucket, instead of refusing to start over it
- name: Create the datastore in the bucket
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 'datastore', 'create', pbs_offsite_datastore, pbs_offsite_cache_path,
          '--backend=type=s3,client=' ~ pbs_offsite_endpoint_id ~ ',bucket=' ~ pbs_offsite_b2_bucket,
          '--gc-schedule=' ~ pbs_offsite_gc_schedule]
        + (['--reuse-datastore=true', '--overwrite-in-use=true'] if pbs_offsite_reuse | bool else []) }}
  changed_when: true
  when: pbs_offsite_datastore_missing | bool

- name: Read sync jobs
  ansible.builtin.command: proxmox-backup-manager sync-job list --output-format json
  register: pbs_offsite_sync_jobs
  changed_when: false
  check_mode: false
  failed_when: pbs_offsite_sync_jobs.rc != 0 and not ansible_check_mode

# No --remote makes it a local sync, from one of pbs2's datastores to the other
- name: Create the copy job
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - sync-job
      - create
      - "{{ pbs_offsite_sync_job_id }}"
      - --store={{ pbs_offsite_datastore }}
      - --remote-store={{ pbs_datastore }}
      - --schedule={{ pbs_offsite_sync_schedule }}
      - --encrypted-only=true
      - --remove-vanished=false
  changed_when: true
  when: pbs_offsite_sync_job_id not in pbs_offsite_sync_jobs.stdout | default('[]', true) | from_json | map(attribute='id')

- name: Read prune jobs
  ansible.builtin.command: proxmox-backup-manager prune-job list --output-format json
  register: pbs_offsite_prune_jobs
  changed_when: false
  check_mode: false
  failed_when: pbs_offsite_prune_jobs.rc != 0 and not ansible_check_mode

- name: Create the prune job
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - prune-job
      - create
      - "{{ pbs_offsite_prune_job_id }}"
      - --store={{ pbs_offsite_datastore }}
      - --schedule={{ pbs_offsite_prune_schedule }}
      - --keep-daily={{ pbs_offsite_keep.daily }}
      - --keep-weekly={{ pbs_offsite_keep.weekly }}
      - --keep-monthly={{ pbs_offsite_keep.monthly }}
  changed_when: true
  when: pbs_offsite_prune_job_id not in pbs_offsite_prune_jobs.stdout | default('[]', true) | from_json | map(attribute='id')

- name: Read verify jobs
  ansible.builtin.command: proxmox-backup-manager verify-job list --output-format json
  register: pbs_offsite_verify_jobs
  changed_when: false
  check_mode: false
  failed_when: pbs_offsite_verify_jobs.rc != 0 and not ansible_check_mode

- name: Create the verify job
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - verify-job
      - create
      - "{{ pbs_offsite_verify_job_id }}"
      - --store={{ pbs_offsite_datastore }}
      - --schedule={{ pbs_offsite_verify_schedule }}
      - --ignore-verified=true
      - --outdated-after={{ pbs_offsite_verify_outdated_after }}
  changed_when: true
  when: pbs_offsite_verify_job_id not in pbs_offsite_verify_jobs.stdout | default('[]', true) | from_json | map(attribute='id')
