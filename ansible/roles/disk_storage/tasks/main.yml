- name: Read volume groups
  ansible.builtin.command: vgs --noheadings -o vg_name
  register: disk_storage_vgs
  changed_when: false
  check_mode: false

# One-time and destructive: only runs while the volume group doesn't exist, so later runs never touch the disk
- name: Wipe the disk and create the volume group
  ansible.builtin.shell: |
    set -e
    for part in {{ item.disk }}-part*; do
      [ -e "$part" ] && wipefs --all "$part"
    done
    wipefs --all {{ item.disk }}
    udevadm settle
    vgcreate {{ item.vg }} {{ item.disk }}
  args:
    executable: /bin/bash
  loop: "{{ disk_storage_disks }}"
  loop_control:
    label: "{{ item.vg }}"
  when: item.vg not in disk_storage_vgs.stdout.split()
  changed_when: true

- name: Read Proxmox storage
  ansible.builtin.command: pvesh get /storage --output-format json
  register: disk_storage_list
  changed_when: false
  check_mode: false

# Thick LVM: each only holds a few big volumes, so thin provisioning buys nothing
- name: Add the volume group as Proxmox storage
  ansible.builtin.command:
    argv:
      - pvesm
      - add
      - lvm
      - "{{ item.storage_id }}"
      - --vgname={{ item.vg }}
      - --nodes={{ disk_storage_node }}
      - --content=rootdir,images
  loop: "{{ disk_storage_disks }}"
  loop_control:
    label: "{{ item.storage_id }}"
  when: item.storage_id not in disk_storage_list.stdout | from_json | map(attribute='storage')
