# The M75s's local disks, each turned into a volume group and thick LVM Proxmox storage; by-id so a renumbered disk can't be wiped by mistake
disk_storage_node: live-laugh-tomcruise
disk_storage_disks:
  # 2 TB HDD, all of it Jellyfin's media volume (stacks/homelab/jellyfin.tf)
  - { disk: /dev/disk/by-id/ata-ST2000DM001-1ER164_Z4Z0BAQY, vg: hdd, storage_id: hdd-lvm }
  # 1 TB SSD, all of it PBS's datastore volume (stacks/homelab/pbs.tf)
  - { disk: /dev/disk/by-id/ata-Samsung_SSD_850_EVO_1TB_S21CNWAG205072Y, vg: ssd, storage_id: ssd-lvm }
