media_share_name: media
media_share_path: /mnt/media
media_share_user: media
# Files land owned by Jellyfin so it can manage them like its own
media_share_owner: jellyfin
# Only read when the Samba account doesn't exist yet, so it never needs to be in the repo
media_share_password: "{{ lookup('ansible.builtin.env', 'MEDIA_SHARE_PASSWORD') }}"
