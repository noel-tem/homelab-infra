# Host-mode jobs run on this container directly: checkout needs git, JavaScript actions need node
- name: Install job dependencies
  ansible.builtin.apt:
    name: [git, nodejs, jq, curl]
    update_cache: true
    cache_valid_time: 3600

- name: Create gitea-runner group
  ansible.builtin.group:
    name: gitea-runner
    system: true

- name: Create gitea-runner user
  ansible.builtin.user:
    name: gitea-runner
    group: gitea-runner
    system: true
    shell: /bin/bash
    home: "{{ gitea_runner_home }}"

# Downloads only when the file is missing or its checksum doesn't match
- name: Install Gitea runner binary
  ansible.builtin.get_url:
    url: "{{ gitea_runner_url }}"
    checksum: sha256:{{ gitea_runner_sha256 }}
    dest: /usr/local/bin/gitea-runner
    owner: root
    group: root
    mode: "0755"
  notify: Restart Gitea runner

- name: Create config directory
  ansible.builtin.file:
    path: /etc/gitea-runner
    state: directory
    mode: "0755"

- name: Write runner config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/gitea-runner/config.yaml
    mode: "0644"
  notify: Restart Gitea runner

- name: Check whether the runner is registered
  ansible.builtin.stat:
    path: "{{ gitea_runner_home }}/.runner"
  register: gitea_runner_registration

# Registers once; delete .runner (and the runner in Gitea's settings) to register again
- name: Register with Gitea
  when: not gitea_runner_registration.stat.exists
  block:
    # Scoped to the repo, so only its workflows can use this runner
    - name: Generate a registration token
      ansible.builtin.command: >-
        runuser -u git -- /usr/local/bin/gitea --config /etc/gitea/app.ini --work-path /var/lib/gitea
        actions generate-runner-token --scope {{ gitea_repo }}
      delegate_to: gitea
      # The inventory keys connection vars on inventory_hostname, which stays "runner" when delegating
      vars:
        ansible_host: "{{ nodes[guests.gitea.node].ip }}"
        proxmox_vmid: "{{ guests.gitea.vmid }}"
      register: gitea_runner_token
      changed_when: true
      no_log: true

    - name: Register the runner
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - gitea-runner
          - --
          - /usr/local/bin/gitea-runner
          - register
          - --config
          - /etc/gitea-runner/config.yaml
          - --no-interactive
          - --instance
          - "{{ gitea_url }}"
          - --name
          - "{{ gitea_runner_name }}"
          - --labels
          - "{{ gitea_runner_labels | join(',') }}"
        chdir: "{{ gitea_runner_home }}"
      # Through the environment rather than argv, so it isn't in the process list
      environment:
        GITEA_RUNNER_REGISTRATION_TOKEN: "{{ gitea_runner_token.stdout | trim }}"
      changed_when: true
      notify: Restart Gitea runner

- name: Write systemd unit
  ansible.builtin.template:
    src: gitea-runner.service.j2
    dest: /etc/systemd/system/gitea-runner.service
    mode: "0644"
  notify: Restart Gitea runner

- name: Enable and start the runner
  ansible.builtin.systemd_service:
    name: gitea-runner
    enabled: true
    state: started
    daemon_reload: true
