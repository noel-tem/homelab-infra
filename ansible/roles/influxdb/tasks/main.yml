- name: Add InfluxData apt repository
  ansible.builtin.deb822_repository:
    name: influxdata
    types: deb
    uris: https://repos.influxdata.com/debian
    suites: stable
    components: main
    signed_by: https://repos.influxdata.com/influxdata-archive.key
  register: influxdb_repo

- name: Install InfluxDB
  ansible.builtin.apt:
    name: influxdb2
    update_cache: true
    # A fresh repo isn't in the cache yet, even if the cache is under an hour old
    cache_valid_time: "{{ 0 if influxdb_repo is changed else 3600 }}"

- name: Enable and start InfluxDB
  ansible.builtin.systemd_service:
    name: influxdb
    enabled: true
    state: started

# Also waits for InfluxDB to come up after a fresh install
- name: Check whether InfluxDB is set up
  ansible.builtin.uri:
    url: http://localhost:8086/api/v2/setup
  register: influxdb_setup
  until: influxdb_setup.status == 200
  retries: 10
  delay: 3
  # InfluxDB isn't installed yet on a first dry run
  failed_when: influxdb_setup.status != 200 and not ansible_check_mode
  check_mode: false

# One-time: creates the admin user, org, bucket and the token everything else uses
- name: Set up InfluxDB
  when: (influxdb_setup.json | default({})).allowed | default(false)
  block:
    - name: Require the admin password and token
      ansible.builtin.assert:
        that:
          - influxdb_admin_password | length > 0
          - influxdb_token | length > 0
        fail_msg: Set INFLUXDB_PASSWORD and INFLUXDB_TOKEN to set up InfluxDB

    - name: Create admin user, org and bucket
      ansible.builtin.uri:
        url: http://localhost:8086/api/v2/setup
        method: POST
        body_format: json
        body:
          username: "{{ influxdb_admin_user }}"
          password: "{{ influxdb_admin_password }}"
          org: "{{ influxdb_org }}"
          bucket: "{{ influxdb_bucket }}"
          retentionPeriodSeconds: "{{ influxdb_retention_days * 86400 }}"
          token: "{{ influxdb_token }}"
        status_code: 201
      no_log: true
      changed_when: true
