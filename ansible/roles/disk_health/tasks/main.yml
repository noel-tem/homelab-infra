- name: Add InfluxData apt repository
  ansible.builtin.deb822_repository:
    name: influxdata
    types: deb
    uris: https://repos.influxdata.com/debian
    suites: stable
    components: main
    signed_by: https://repos.influxdata.com/influxdata-archive.key
  register: disk_health_repo

- name: Install Telegraf and smartmontools
  ansible.builtin.apt:
    name: [telegraf, smartmontools]
    update_cache: true
    # A fresh repo isn't in the cache yet, even if the cache is under an hour old
    cache_valid_time: "{{ 0 if disk_health_repo is changed else 3600 }}"

# Telegraf runs as an unprivileged user, and smartctl needs root to read a disk
- name: Let Telegraf run smartctl
  ansible.builtin.copy:
    content: "telegraf ALL=(root) NOPASSWD: /usr/sbin/smartctl\n"
    dest: /etc/sudoers.d/telegraf-smartctl
    mode: "0440"
    validate: visudo -cf %s

- name: Write the ZFS pool capacity script
  ansible.builtin.copy:
    src: zpool-capacity.sh
    dest: /usr/local/bin/zpool-capacity
    mode: "0755"

# Replaces the packaged config, which is a long list of commented-out examples
- name: Write Telegraf config
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: telegraf
    mode: "0640"
  no_log: true
  notify: Restart Telegraf

- name: Enable and start Telegraf
  ansible.builtin.systemd_service:
    name: telegraf
    enabled: true
    state: started
