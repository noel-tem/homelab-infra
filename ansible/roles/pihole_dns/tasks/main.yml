- name: Read local DNS records
  ansible.builtin.command: pihole-FTL --config dns.hosts
  register: pihole_dns_current
  changed_when: false
  check_mode: false

# Overwrites Pi-hole's whole dns.hosts list, so records added in the web UI get replaced
- name: Set local DNS records
  ansible.builtin.command:
    argv: [pihole-FTL, --config, dns.hosts, "{{ pihole_dns_hosts | to_json }}"]
  # The output looks like "[ ip name, ip name ]", so compare its entries rather than the exact text
  when: >-
    pihole_dns_current.stdout | trim | regex_replace('^\\[|\\]$', '') | split(',')
    | map('trim') | select | list != pihole_dns_hosts
