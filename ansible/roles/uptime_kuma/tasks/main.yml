# Debian 13's Node 20 meets Uptime Kuma's >= 20.4 requirement
- name: Install Node.js and git
  ansible.builtin.apt:
    name: [nodejs, npm, git]
    update_cache: true
    cache_valid_time: 3600

- name: Create uptime-kuma group
  ansible.builtin.group:
    name: uptime-kuma
    system: true

- name: Create uptime-kuma user
  ansible.builtin.user:
    name: uptime-kuma
    group: uptime-kuma
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# The code stays root-owned; the service only writes to its data directory
- name: Check out Uptime Kuma
  ansible.builtin.git:
    repo: https://github.com/louislam/uptime-kuma.git
    dest: "{{ uptime_kuma_path }}"
    version: "{{ uptime_kuma_version }}"
    depth: 1
  register: uptime_kuma_checkout
  notify: Restart Uptime Kuma

- name: Check for the built frontend
  ansible.builtin.stat:
    path: "{{ uptime_kuma_path }}/dist/index.html"
  register: uptime_kuma_dist

# What upstream's `npm run setup` does, minus its git checkout; reruns when the version changes
- name: Install dependencies and frontend
  ansible.builtin.shell: npm ci --omit dev --no-audit && npm run download-dist
  args:
    chdir: "{{ uptime_kuma_path }}"
  changed_when: true
  when: uptime_kuma_checkout is changed or not uptime_kuma_dist.stat.exists
  notify: Restart Uptime Kuma

- name: Create data directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_data }}"
    state: directory
    owner: uptime-kuma
    group: uptime-kuma
    mode: "0750"

- name: Write systemd unit
  ansible.builtin.template:
    src: uptime-kuma.service.j2
    dest: /etc/systemd/system/uptime-kuma.service
    mode: "0644"
  notify: Restart Uptime Kuma

- name: Enable and start Uptime Kuma
  ansible.builtin.systemd_service:
    name: uptime-kuma
    enabled: true
    state: started
