# Otherwise a run from a shell without .env loaded would blank the deployer's credentials
- name: Check every credential is in the environment
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', item) | length > 0
    fail_msg: "{{ item }} isn't set; load .env (direnv) first"
    quiet: true
  loop: "{{ deployer_env_vars }}"

- name: Install git, jq, curl and ssh
  ansible.builtin.apt:
    name: [git, jq, curl, openssh-client]
    update_cache: true
    cache_valid_time: 3600

- name: Create deployer group
  ansible.builtin.group:
    name: deployer
    system: true

- name: Create deployer user
  ansible.builtin.user:
    name: deployer
    group: deployer
    system: true
    shell: /bin/bash
    home: "{{ deployer_home }}"

- name: Create .ssh directory
  ansible.builtin.file:
    path: "{{ deployer_home }}/.ssh"
    state: directory
    owner: deployer
    group: deployer
    mode: "0700"

# Its own key, authorized on the Proxmox nodes by playbooks/ci.yml, at the path the inventory expects
- name: Generate SSH key
  ansible.builtin.command: runuser -u deployer -- ssh-keygen -q -t ed25519 -N "" -C deployer@homelab -f {{ deployer_home }}/.ssh/id_ed25519
  args:
    creates: "{{ deployer_home }}/.ssh/id_ed25519"

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ deployer_home }}/.ssh/id_ed25519.pub"
  register: deployer_ssh_key

- name: Read the Proxmox nodes' host keys
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  delegate_to: "{{ item }}"
  loop: "{{ groups['proxmox'] }}"
  register: deployer_host_keys

# Taken from the nodes over the workstation's trusted connection, so the deployer never has to trust on first use
- name: Write known_hosts
  ansible.builtin.copy:
    content: |
      {% for result in deployer_host_keys.results %}
      {{ nodes[result.item].ip }} {{ (result.content | b64decode).split()[:2] | join(' ') }}
      {% endfor %}
    dest: "{{ deployer_home }}/.ssh/known_hosts"
    owner: deployer
    group: deployer
    mode: "0644"

- name: Create config directory
  ansible.builtin.file:
    path: /etc/deployer
    state: directory
    mode: "0700"

# Read by systemd as root before it switches to the deployer user
- name: Write credentials
  ansible.builtin.template:
    src: env.j2
    dest: /etc/deployer/env
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Written atomically, so a deploy that's running this role keeps running the old copy
- name: Write deploy script
  ansible.builtin.template:
    src: deploy.sh.j2
    dest: /usr/local/bin/deploy
    mode: "0755"

- name: Write systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [deployer.service, deployer.timer]
  register: deployer_units

- name: Enable and start the timer
  ansible.builtin.systemd_service:
    name: deployer.timer
    enabled: true
    state: started
    daemon_reload: "{{ deployer_units is changed }}"
