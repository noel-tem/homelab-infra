- name: Add Jellyfin apt repository
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: deb
    uris: https://repo.jellyfin.org/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://repo.jellyfin.org/jellyfin_team.gpg.key
  register: jellyfin_repo

- name: Install Jellyfin
  ansible.builtin.apt:
    name: jellyfin
    update_cache: true
    # A fresh repo isn't in the cache yet, even if the cache is under an hour old
    cache_valid_time: "{{ 0 if jellyfin_repo is changed else 3600 }}"

# The volume is created root-owned; Jellyfin needs to write metadata next to the media
- name: Give Jellyfin the media volume
  ansible.builtin.file:
    path: /mnt/media
    state: directory
    owner: jellyfin
    group: jellyfin
    mode: "0755"

- name: Enable and start Jellyfin
  ansible.builtin.systemd_service:
    name: jellyfin
    enabled: true
    state: started
